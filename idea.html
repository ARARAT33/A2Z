<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AWE A2Z public idea page"><title>Idea — AWE A2Z</title><link rel="stylesheet" href="styles.css"></head><body><div class="aurora aurora-a"></div><div class="aurora aurora-b"></div><div class="aurora aurora-c"></div><header class="nav glass"><a class="logo" href="index.html"><span class="logo-mark">A</span><span>AWE<span class="accent">A2Z</span></span></a><nav><a href="index.html#ideas">Explore</a><a href="index.html#categories">Categories</a><a href="index.html#about">About</a></nav><a class="btn btn-primary" href="index.html#ideas">Back to archive</a></header><main class="idea-page"><div id="ideaView" class="idea-view glass"><div class="loading">Loading idea…</div></div></main><footer><div class="logo"><span class="logo-mark">A</span><span>AWE<span class="accent">A2Z</span></span></div><p>The open archive of ideas and thoughts.</p><span>Built for the AWE ecosystem.</span></footer><script>const DB_URL='https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/a2zdb.json';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const id=new URLSearchParams(location.search).get('id');const root=document.querySelector('#ideaView');try{const raw=await (await fetch(DB_URL,{cache:'no-store'})).json();const arr=Array.isArray(raw)?raw:(raw.ideas||raw.data||raw.items||[]);const x=arr.find((v,i)=>String(v.id||i+1)===String(id));if(!x)throw 0;const title=x.title||x.name||'Untitled idea',idea=x.idea||x.description||x.content||x.text||'',cat=x.category||x.type||'Other',author=x.anonymous?'Anonymous':(x.author||'Anonymous');document.title=title+' — AWE A2Z';root.innerHTML=`<div class="idea-page-head"><div class="eyebrow">${esc(cat)} · A2Z ARCHIVE</div><div class="idea-id">ID ${esc(x.id||id)}</div></div><h1>${esc(title)}</h1><div class="idea-meta"><span>${esc(author)}</span><span>•</span><span>Open for everyone to use</span></div><div class="idea-body">${esc(idea).replace(/\n/g,'<br><br>')}</div><div class="rights-note"><strong>This idea is not owned by AWE.</strong><p>AWE A2Z does not claim ownership of this contribution. Ideas published here are intended as a public, reusable resource and may be used, developed or transformed by anyone. The contributor must only submit material they have the right to release under this principle.</p></div><div class="report-box"><div><div class="eyebrow">SEE A PROBLEM?</div><h3>Request removal</h3><p>AWE cannot manually verify every idea. If you believe this specific idea should be removed, email the idea ID and the reason. AWE will review the report and remove it if the issue is valid.</p></div><a class="btn btn-primary" href="mailto:araratavetisyan777999@gmail.com?subject=AWE%20A2Z%20Removal%20Request%20—%20ID%20${encodeURIComponent(x.id||id)}&body=Idea%20ID%3A%20${encodeURIComponent(x.id||id)}%0A%0AReason%20for%20removal%3A%0A">Report ID ${esc(x.id||id)} →</a></div>`}catch(e){root.innerHTML='<div class="empty"><div class="empty-symbol">⌁</div><h3>Idea not found</h3><p>This idea may have been removed or the ID is invalid.</p><a class="btn btn-primary" href="index.html#ideas">Explore the archive</a></div>'}}init();</script></body></html>
